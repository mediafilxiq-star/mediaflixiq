<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA FLIX | ميديا فليكس</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0910;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 650px;
            padding: 20px;
            text-align: center;
        }
        h1 {
            background: linear-gradient(135deg, #fff, #b19cd9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            font-size: 32px;
        }
        p {
            color: #b19cd9;
            margin-bottom: 30px;
        }
        .video-box {
            background: rgba(21, 17, 34, 0.85);
            padding: 15px;
            border-radius: 16px;
            margin-top: 20px;
            border: 1px solid rgba(123, 44, 191, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* مقاس سينمائي 16:9 */
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MEDIA FLIX</h1>
        <p>إنتاج وتصوير سينمائي • مونتاج احترافي</p>

        <!-- قسم عرض الفيديو السينمائي -->
        <div class="video-box">
            <h3 style="margin-top: 0; font-size: 16px; color: #fff;">🎬 فيديو محرم السينمائي</h3>
            
            <div class="video-container">
                <!-- رابط اليوتيوب الجديد الخاص بك -->
                <iframe src="https://www.youtube.com/embed/RyBg0f0mVw" allowfullscreen></iframe>
            </div>
        </div>
    </div>
</body>
</html>
